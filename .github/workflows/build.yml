name: Native builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x64
          - os: windows-2022
            name: windows-x64
          - os: macos-14
            name: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux desktop development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libasound2-dev libpulse-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libdecor-0-dev
      - name: Configure
        shell: bash
        run: |
          args=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            args+=("-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64")
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "${args[@]}"
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Tests without proprietary game data
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        working-directory: build
        run: cpack -C Release
      - name: Corresponding source package
        working-directory: build
        run: cpack --config CPackSourceConfig.cmake
      - uses: actions/upload-artifact@v4
        with:
          name: fta2-native-${{ matrix.name }}
          path: build/fta2-native-*.zip
