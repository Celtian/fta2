name: 🛠️ Desktop builds

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: 🧪 Validate & Package
    uses: ./.github/workflows/desktop.yml
